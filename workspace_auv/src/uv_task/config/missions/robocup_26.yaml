mission:
  name: robocup_26
  tasks:
    - name: start
      config: ../tasks/start.yaml
      initial:
        pose:
          command: BMOVE
          axes: xyzrz
          target: [0.0, 0.0, 0.0, 0.0]
      on_failure:
        "start.timeout": {}

    - name: return_origin
      config: ../tasks/return_origin.yaml
      initial:
        pose:
          command: SET
          axes: xyzrz
          target: [5.0, -2.0, 0.0, 89.9544] # yaw: 1.57 rad converted to degrees
      on_failure:
        "return_origin.timeout": {}

    - name: btravelx
      config: ../tasks/btravelx.yaml
      initial:
        poses:
          - command: WTRAVEL
            axes: xyz
            target: [5.0, -1.5, 0.0, 89.9544] # 世界系绝对位置；航向先沿行进方向。
          - command: SET
            axes: rz
            target: [0.0, 0.0, 0.0, 89.9544] # 到点后设置 1.57 rad 航向。
      on_failure:
        "btravelx.timeout": {}

    # - name: setz
