    - name: 26rb_hit_balls
      config: ../tasks/26rb_hit_balls.yaml
      initial:
        poses:
          - command: SET
            axes: z
            target: [0.0, 0.0, 0.2, 0.0] # 到点后设置 1.57 rad 航向。
          - command: WTRAVEL
            axes: xyz
            target: [5.0, -1.5, 0.2, 89.9544] # 世界系绝对位置；航向先沿行进方向。
          - command: SET
            axes: rz
            target: [0.0, 0.0, 0.0, 89.9544] # 到点后设置 1.57 rad 航向。
      on_failure:
        "26rb_hit_balls.timeout": {}

