# 海参抓取任务链：先执行 START，再读取抓取任务参数。
# 运行前需确认 ../tasks/grab_sea_cucumber.yaml 中标出的占位值。
# START 会建立本次坐标原点和初始方向，扫描与投放位姿均以此为参照。
mission:
  name: grab_sea_cucumber
  tasks:
    - name: start
      config: ../tasks/start.yaml
      params:
        skip_preparation: true # 与建图任务链一致：跳过准备倒计时，仍执行 START。
    - name: grab_sea_cucumber
      config: ../tasks/grab_sea_cucumber.yaml
