# 真机独立任务：视觉对孔后执行三次预设 yaw 推盘，不判断实际盘体转角。
# 现场测量和放行见 docs/turntable_calibration_checklist.md；未确认前禁止接触。
task: turntable
params:
  allow_contact_motion: false
  force_limited_control_confirmed: false
  # 以下仅为待复核的调试占位值；现场测量并确认限推力前不得放行接触。
  rod_radius_m: 0.02
  approach_standoff_m: 0.2
  insert_depth_m: 0.03
  stroke_yaw_deg: 6.0  # 单次预设行程；建议从更小角度试起，最大 12°
