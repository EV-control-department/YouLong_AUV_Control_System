# 真机独立任务：左下孔插入一次 → 上浮 → yaw转动 → 下沉 → 退杆。
# 现场测量和放行见 docs/turntable_calibration_checklist.md；未确认前禁止接触。
task: turntable
params:
  # 可选粗定位：盘心在 START 后 odom 系中的 [x米, y米, z米, yaw度]。
  # z向下；yaw=机头正对盘心时的航向，不是盘面黄色条幅的角度。
  # [] 表示不自动粗定位，需人工/任务列表先到观察位。
  # 实测后例如填写 [1.0, 2.0, 0.6, 90.0]；示例不是安全运动目标。
  # 自动粗定位也要求下面两个放行开关均为true；路径须人工确认无障碍。
  disk_pose_odom: []
  allow_contact_motion: false
  force_limited_control_confirmed: false
  # 以下仅为待复核的调试占位值；现场测量并确认限推力前不得放行接触。
  rod_radius_m: 0.02
  approach_standoff_m: 0.2
  insert_depth_m: 0.03
  stroke_yaw_deg: 6.0  # 单次预设行程；建议从更小角度试起，最大 12°
  # 待水中实测；以下是小行程调试占位值，不保证圆盘180°转动。
  # yaw为AUV角度，不是圆盘角度；切勿直接填180。
  contact_ascent_m: 0.02  # 插入后上浮距离，正数，最大0.05m
  contact_descent_m: 0.02 # yaw后下沉距离，正数，最大0.05m；无需与上浮相等
