# 每门: BTRAVEL + SET -> 观察/完整左右扫视 -> 固定目标对正 -> 高度伺服 -> BLINE。
# z 正向向下；yaw/角速度为度/度每秒；高度百分比使用单目画面高度。
task: 26rb_gate_task
params:
  gate_count: 1
  timeout: 720.0  # 单门总时限，下一门重新计时。
  max_failures: 1  # 允许失败后跳到下一门的次数；最后一门失败仍返回失败。
  observation:
    poses: [[1.5, -2.0, 0.2, 0.0]]  # odom 绝对 [x,y,z,yaw]；数量等于 gate_count。
    travel_timeout: 60.0
    set_timeout: 20.0
  tracking:
    confirm_frames: 3
    max_center_distance_fraction: 0.12
    max_height_ratio: 1.5
    ambiguity_margin: 0.15
  # 门深：米；kp 输出 m/s，容限米。
  depth:
    set_timeout: 10.0
    kp: 0.8
    max_speed_mps: 0.12
    tolerance_m: 0.03
  # 观察/超时/灯光均为秒，转向角度为度，角速度为度/秒。
  search:
    observe_seconds: 2.0
    scan_angle_deg: 90.0  # 右扫 -> SET 返回观测位姿 -> 左扫，途中见框也完成搜索。
    yaw_rate_deg_s: 10.0
    timeout: 60.0
    detection_timeout: 1.5
    min_confidence: 0.02
    min_bbox_pixels: 12.0
    lock_bearing_tolerance_deg: 20.0
    priority_release_seconds: 2.0
    reacquire_timeout: 10.0
    align_observe_seconds: 1.0
    align_timeout: 20.0
    yaw_kp: 1.2
    max_yaw_rate_deg_s: 12.0
    velocity_period: 0.05
    light_pulse_seconds: 0.3
    light_gap_seconds: 0.3
  # 高度容限为百分点，目标 70±1%；保持本门巡游深度。
  fore_aft:
    target_height_percent: 70.0
    height_tolerance_percent: 1.0
    stable_seconds: 0.5
    speed_mps: 0.1
    reverse_speed_mps: 0.08
    height_kp: 0.4
    line_kp: 0.5
    max_cross_speed_mps: 0.03
    line_tolerance_m: 0.03
    max_travel_m: 1.2
    timeout: 10.0
    observe_seconds: 1.0
  # 双目配对时间秒、射线距离米；最终 yaw 超时未稳定则失败。
  pass:
    yaw_servo_min_seconds: 1.0
    yaw_servo_max_seconds: 3.0
    yaw_tolerance_deg: 2.0
    yaw_stable_seconds: 0.3
    yaw_kp: 1.2
    max_yaw_rate_deg_s: 12.0
    stereo_pair_slop: 0.25
    stereo_max_ray_gap_m: 0.15
    stereo_min_angle_deg: 0.1
    stereo_max_distance_m: 30.0
    distance_m: 1.6
    speed_mps: 0.2
    timeout: 20.0
    pause_seconds: 0.5
