# 视觉模式：首门 SET 到预设位姿；过门后原地观察下一门，没看到才 SET 到下一条预设位姿。
# 当前最大框对准 -> 单次近距 BLINE -> 可选再次对准 -> 1m 穿门；不跟踪门框身份。
# z 正向向下；yaw/角速度为度/度每秒；高度百分比使用单目画面高度。
task: 26rb_gate_task
params:
  gate_count: 4 # 实际执行门数，范围 1–4；第 5 条位姿仅作为第 4 门定点通过的出口。
  timeout: 720.0 # 单门总时限，下一门重新计时。
  max_failures: 2 # 允许失败后跳到下一门的次数；最后一门失败仍返回失败。
  fixed_pass:
    code: "0111" # 左到右第 1–4 门；0=视觉通过，1=前往后一条位姿。保留引号。
  observation:
    # odom 绝对 [x,y,z,yaw]；第一门定点模式先 SET 到第 1 条，再 BLINE 前往第 2 条。
    poses:
      - [1.3, 0.3, 0.4, 90.0] # 第 1 门
      - [1.9, 2.0, 0.18, 90.0] # 第 2 门
      - [1.48, 3.9, 0.18, 90.0] # 第 3 门
      - [1.70, 4.2, 0.4, 90.0] # 第 4 门
      - [1.70, 0.3, 0.4, 90.0] # 第 5 门
    xy_radius_m: [0.8, 0.8, 0.8, 0.8, 0.8] # 与位姿序号对应；进入终点的 XY 半径才停车调深。
    travel_timeout: 60.0 # 定点模式每段 BLINE 的时限；速度使用 pass.speed_mps。
    set_timeout: 20.0 # SET 到预设完整位姿的到点超时，单位秒。
  # 门深：米；kp 输出 m/s，容限米。
  depth:
    set_timeout: 10.0
    kp: 0.8
    max_speed_mps: 0.12
    tolerance_m: 0.03
  # 观察/超时/灯光均为秒，转向角度为度，角速度为度/秒。
  search:
    observe_seconds: 2.0
    scan_angle_deg: 90.0 # 右扫 -> SET 返回观测位姿 -> 左扫；发现当前有效门框就停止扫描并对准。
    yaw_rate_deg_s: 10.0
    position_hold_kp: 0.8 # 左右扫视时将世界XY拉回观测位姿，单位：1/秒。
    position_hold_max_speed_mps: 0.05 # 扫视中的XY位置保持速度上限。
    position_hold_tolerance_m: 0.01 # 观测位姿XY误差在此范围内时不修正。
    timeout: 60.0
    detection_timeout: 1.5
    min_confidence: 0.02
    min_bbox_pixels: 12.0
    align_timeout: 20.0
    velocity_period: 0.05
    light_pulse_seconds: 0.3
    light_gap_seconds: 0.3
  # 对正后单次向前 BLINE；所有当前有效观测中的最大框高超限时停车，丢框继续走到上限。
  fore_aft:
    height_limit_percent: 80.0 # 最大 bbox 高度 / 单目画面高度 > 80% 时停车。
    speed_mps: 0.25 # 近距 BLINE 正向巡航速度。
    max_distance_m: 0.30 # 单次近距 BLINE 行程上限，单位米。
    position_tolerance_m: 0.01 # 此次 BLINE 到点容差。
    timeout: 30.0
  # 停车后对准当前最大框；无框或 yaw 未稳定就直接穿门，不再等待重获。
  pass:
    yaw_servo_min_seconds: 1.0
    yaw_servo_max_seconds: 3.0
    yaw_tolerance_deg: 2.0
    yaw_stable_seconds: 0.3
    yaw_kp: 1.2
    max_yaw_rate_deg_s: 12.0
    distance_m: 1.0
    speed_mps: 0.2
    timeout: 20.0
    next_observe_seconds: 2.0 # 过门后保持终点观察下一门；没看到才 SET 到下一条预设位姿。
    pause_seconds: 0.5 # 最后一门通过后的停顿；门间使用上面的原地观察。
