task: 26rb_drop_ball_target_rack

params:
  # 先定深、朝向预设 rack；前视观测与 yaw 对准后前向巡游。
  # 预设 odom [x,y,z]；z 仅描述 rack 位置，不参与 XY 半径或巡游深度。
  rack_position: [5.8, -2.0, -1.0]
  depth:
    task_depth_m: 0.2 # 进入任务时定深；水平伺服、圆盘爪和发夹爪平移共用锁定深度。
    timeout: 15.0 # 初始定深动作超时，秒。

  search:
    timeout: 20.0 # 累计 BLINE 运行时间；停车校准、闪灯不计时。
    near_radius_m: 0.3 # 到 rack 预设 XY 的二维水平半径，米。
    near_timeout: 10.0 # 首次进入后累计 BLINE 时间；停车暂停，离开不重置。
    front_observe_seconds: 2.0
    front_align_seconds: 3.0 # 单目 yaw 对准，同时尝试标定双目联合对准。
    yaw_tolerance_deg: 2.0
    yaw_stable_seconds: 0.2
    yaw_gain: 1.2
    max_yaw_rate_deg_s: 10.0
    speed_mps: 0.15 # BLINE 要求 0 < speed < 0.18。
    detection_timeout: 0.8
    min_confidence: 0.02
    detection_stop_delay: 0.5 # 下视发现 rack 后亮绿灯，继续半秒，再停止巡游。
    fallback_observe_seconds: 2.0 # 超时定点到预设 XY 后等待新的下视 rack 检测。
    fallback_rotate_speed_deg_s: 30.0 # 定点观察失败后保持深度原地旋转。
    fallback_rotate_degrees: 360.0 # 最多旋转一整圈。
    fallback_rotate_timeout: 15.0 # 一整圈搜索安全上限。
    move_timeout: 60.0 # 朝向、停车保持和兜底定点动作的超时。
    period: 0.05
    stereo_pair_slop: 0.15 # 优先相同 ID；缺少 ID 时按时间戳配对。
    stereo_min_angle_deg: 0.1
    stereo_max_ray_gap_m: 0.05
    stereo_max_distance_m: 20.0
    cancel_timeout: 2.0 # 取消 BLINE 后确认终止，再启动校准或定点。

  # 巡游看到下视 rack 后接以下原投球流程。
  # 下视仅用 detection 做单目像素伺服，不使用 tracks、measurements 或双目定位。
  observation:
    seconds: 2.0 # 完整观察 2 秒；首次下视看到rack由共享搜索统一闪1次绿灯。

  # 谁先收到 rack detection 就获得单目伺服优先权；成功后闪 1 次绿灯。
  visual_servo:
    timeout: 20.0 # 视觉伺服最长时间，单位：秒；超时仍按最后位姿完成放球放环。
    stable_seconds: 1.0 # 像素误差连续满足容差的时间，单位：秒。
    detection_timeout: 0.8 # 下视检测消息最大允许年龄，单位：秒。
    camera_priority_seconds: 3.0 # 固定优先权时长；到期、丢目标或消息超时后重新竞争。
    pixel_tolerance_fraction: 0.035 # 图像中心归一化误差容差。
    projection_depth_m: 0.8 # 像素修正的固定米制尺度，不是观测出的距离。
    gain: 0.8 # 像素误差到水平速度的增益，单位：1/秒。
    max_speed_mps: 0.08 # 世界水平合速度上限，单位：米/秒。
    depth_gain: 0.8 # 深度误差到垂直速度的增益，单位：1/秒。
    max_vertical_speed_mps: 0.08 # 定深修正最大垂直速度，单位：米/秒。
    depth_tolerance_m: 0.03 # 居中稳定时还需满足的深度误差，单位：米。
    period: 0.2 # 视觉伺服周期，单位：秒。
    command_timeout: 10.0 # 速度伺服结束后的定点保持超时，单位：秒。

  # 保存本次相机居中位姿，依次用相机到disc_claw_link/hairpin_claw_link的TF
  # 直接计算两个夹爪的SET位姿，不再做速度伺服。
  alignment:
    timeout: 10.0 # 每只夹爪外参SET对准的动作超时，单位：秒。
    settle_seconds: 0.5 # 定位完成后稳定等待，单位：秒。

  # 固定使用 servo 1。本任务 ZitServo.angle 直接发送度数，90° 对应 angle=90.0。
  release:
    angle_deg: 90.0
    repeat_count: 3 # 同一释放角重复发送，降低单条消息丢失影响。
    repeat_period: 0.1 # 重发间隔，单位：秒。
    settle_seconds: 1.0 # 放球后等待机械动作，再定位发夹爪并放环。

  # 固定使用servo 2。放球后发夹爪对准同一rack点，重复发送松开角度。
  ring_release:
    angle_deg: 270.0 # 发夹爪servo 2释放角，直接发送angle=270.0。
    repeat_count: 3
    repeat_period: 0.1
    settle_seconds: 1.0 # 放环后等待机械动作，再闪1次绿灯完成提示。

  # 前视观察黄灯，看到目标后 yaw 对准完成闪1次绿灯；未看到前视目标闪1次红灯。
  # BLINE和外参SET不亮灯；下视看到rack、伺服成功、放球、放环各闪1次绿灯。
  light:
    pulse_seconds: 0.35
    gap_seconds: 0.25
