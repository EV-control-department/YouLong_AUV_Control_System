task: 26rb_grab_ball_ring

params:
  # 全任务作业深度：搜索、frame/球/环水平伺服、抓取前后恢复共用。
  # NED向下为正，单位米；仅抓取下沉阶段暂时离开此深度。
  work_depth_m: 0.03
  depth:
    timeout: 15.0 # 进入作业深度的SET动作超时，单位：秒。
  # 使用 robotcup20260901.yaml 中的 canonical detector class name。
  golf_color: yellow_golf # 可选 pink_golf / yellow_golf。
  collection_frame_class: collection_frame_down
  # 可配置组合抓取顺序： [golf, ring] 或 [ring, golf]。
  pickup:
    order: [golf, ring]

  # 世界 odom 坐标 [x,y,z]，z 是 frame 平面深度，NED 向下为正。
  # 初始值需按实际场地填写；不会从定位器覆盖。
  collection_frame_position: [0.8, 5.7, 0.65]
  search:
    timeout: 60.0 # 累计 BLINE 运行时间；停车校准、闪灯不计时，重新发线不清零。
    near_radius_m: 0.5 # 到预设 [x,y] 的二维水平距离，不考虑深度差。
    near_timeout: 40.0 # 首次进入半径后累计 BLINE 运行时间；停车校准暂停，离开半径不重置。
    front_observe_seconds: 2.0
    front_align_seconds: 3.0 # 单目 yaw 对准，同时尝试标定双目对准。
    yaw_tolerance_deg: 2.0
    yaw_stable_seconds: 0.2
    yaw_gain: 1.2
    max_yaw_rate_deg_s: 10.0
    depth_gain: 0.8
    max_vertical_speed_mps: 0.08
    speed_mps: 0.28 # 请求巡游速度；uv_control 按配置限幅。
    detection_timeout: 0.8
    min_confidence: 0.02
    detection_stop_delay: 1.5 # 巡游时下视看到 frame 后继续半秒，再取消 BLINE。
    fallback_observe_seconds: 2.0 # 定点到预设 XY/巡游深度后等待新的下视检测。
    fallback_rotate_speed_deg_s: 30.0 # 定点观察失败后，保持深度缓慢旋转搜索 frame。
    fallback_rotate_degrees: 360.0 # 最多旋转一整圈；期间发现 frame 会立即停止。
    fallback_rotate_timeout: 15.0 # 旋转搜索安全上限；未转满则按搜索故障处理。
    move_timeout: 10.0 # 定深、朝向、停车保持和兜底定点的 SET 动作超时。
    period: 0.05
    stereo_pair_slop: 0.15 # 同 ID 配对，缺失 ID 时按时间戳配对。
    stereo_min_angle_deg: 0.1
    stereo_max_ray_gap_m: 0.05
    stereo_max_distance_m: 20.0
    cancel_timeout: 2.0 # 取消 BLINE 后必须确认动作结束，才能继续伺服。

  # find/check与servo从同一时刻计时；目标一旦出现就继续对齐。
  find:
    timeout: 15.0 # 首次BLINE见frame或开始抓环时启动；未见当前目标则跳过。
  check:
    timeout: 5.0 # 抓后回到本次目标下视对齐位姿时启动；新鲜双目确认目标消失。
  loss:
    timeout: 5.0 # 目标丢失回frame；frame丢失闭环回历史位姿或预设位置。
    sticky_seconds: 2.0 # 丢失frame/目标后，沿最后有效世界位置低增益伺服的最长时间。

  # frame/目标/回位连续速度修正，所有切换共用servo截止时间。
  vision:
    detection_timeout: 0.8 # 检测结果最大允许年龄，单位：秒。
    # 球和环分别配置各自的中心容差，见下方 golf/ring 配置。
  servo:
    timeout: 30.0 # 与find/check同起点，到期停止发新修正；停车确认后按条件盲抓。
    # 最后一条速度指令仍有独立2秒应答时限，避免伺服到期被误判为通信超时。
    # 球/环各最多盲抓一次，计入各自max_attempts；未进入微调区或没有有效世界位置则跳过。
    # 首次进入当前目标的micro_servo区时平分剩余时间；前半保持原容差，后半线性放宽。
    final_tolerance_fraction: 0.10 # 球/环最终归一化容差10%；换眼、丢失、重入不重置进度。
    period: 0.15 # 水平伺服周期，单位：秒。
    log_period: 0.5 # 固定列宽状态日志周期；含归一化残差、当前容差、剩余时间和PID积分。
    # 球和环分别配置各自的居中保持时间，见下方 golf/ring 配置。
    projection_depth_m: 0.7 # 像素修正的固定米制尺度，不是观测出的距离。
    # frame、golf、ring分别配置主伺服增益，见下方对应配置。
    max_speed_mps: 0.06 # 水平合速度上限，单位：米/秒。
    depth_gain: 0.8 # 实测深度偏差到世界垂直速度的增益，单位：1/秒。
    max_vertical_speed_mps: 0.08 # 定深修正最大垂直速度，单位：米/秒。
    depth_tolerance_m: 0.03 # 进入居中保持需同时满足的深度误差，单位：米。
    position_command_timeout: 10.0 # 停车保持和最终夹爪对准的动作执行超时，单位：秒。

  frame:
    servo_gain: 4.0 # frame水平伺服主增益。
    yaw:
      gain: 0.5 # frame偏航比例增益，保守设置。
      max_rate_deg_s: 3.0 # 机头对准bbox中心时的偏航速率上限。

  # 夹爪舵机 1 先重复发送到 0 rad，降低单次消息丢失的影响。
  claw:
    prepare_angle_rad: 0.0
    prepare_repeat_count: 3
    prepare_repeat_period: 0.1
  light:
    pulse_seconds: 0.35
    gap_seconds: 0.25
  # 外参平移读取TF：使用本次伺服成功的下视相机与对应夹爪，不硬编码偏移；
  # 目标对准直接发送SET位姿，不再另起速度伺服。
  settle_seconds: 3.0 # 外参平移到点后，继续定点保持3秒再下潜；组合抓取的球/环共用。

  # 保持夹爪对准后的XY/yaw，用世界Z速度下压；到深度或超时后球上浮、环先合爪再上浮。
  # 第n次目标 = 对应grab_depth_m + (n-1)*retry_depth_step_m，球/环分别计数。
  descent:
    speed_mps: 0.05 # 下沉速度，NED 正值向下，单位：米/秒。
    timeout: 20.0 # 最长下潜时间；到达目标深度立即停止，不等待满15秒。
    retry_depth_step_m: 0.05 # 每次重试比上次加深5cm；首次不加，设0可禁用。
    xy_hold_gain: 0.8 # 世界XY位置误差到纠偏速度的增益，单位：1/秒。
    xy_hold_max_speed_mps: 0.05 # XY纠偏合速度上限，单位：米/秒。
    yaw_hold_gain: 1.2 # 固定航向误差到偏航角速度的增益，单位：1/秒。
    yaw_hold_max_rate_deg_s: 10.0 # 偏航纠偏角速度上限，单位：度/秒。
  # 恢复使用完整SET：保持本次夹爪对准XY/yaw，上浮到work_depth_m。
  # 定深动作超时沿用servo.position_command_timeout（默认10秒）。
  vertical_publish_period: 0.05 # 速度指令周期，单位：秒。
  return_timeout: 60.0 # 抓后返回该目标原本下视对齐位姿的运动超时。

  # 最多尝试次数包含首次，球失败用尽后仍继续抓环。
  golf:
    max_attempts: 3
    grab_depth_m: 0.65 # 机器人目标Z，暂按旧0.2+0.03*8的深度；不是球自身深度。
    pixel_tolerance_fraction: 0.04 # 球心初始归一化容差；细调后半段放宽到servo.final_tolerance_fraction。
    hold_seconds: 0.5 # 球心进入容差后的保持时间，单位：秒。
    servo_gain: 2.5 # 球 target 伺服 Kp；微伺服区使用 micro_servo.gain。
    servo:
      pid:
        ki: 0.2 # 球 target 伺服积分增益。
        kd: 0.1 # 球 target 伺服微分增益。
        integral_limit: 0.3 # 归一化像素误差积分限幅，单位：秒。
    micro_servo:
      zone_fraction: 0.30 # 球心进入图像中心30%半径后切换微伺服增益。
      gain: 0.6 # 球进入微伺服区后的水平伺服增益。
  ring:
    class: red_ring
    max_attempts: 3
    grab_depth_m: 0.58 # 机器人目标Z，可与球分别设置；不是环自身深度。
    pixel_tolerance_fraction: 0.04 # 环中心初始归一化容差；细调后半段放宽到servo.final_tolerance_fraction。
    hold_seconds: 0.5 # 环中心进入容差后的保持时间，单位：秒。
    servo_gain: 2.5 # 环 target 伺服 Kp；微伺服区使用 micro_servo.gain。
    servo:
      pid:
        ki: 0.2 # 环 target 伺服积分增益。
        kd: 0.1 # 环 target 伺服微分增益。
        integral_limit: 0.3 # 归一化像素误差积分限幅，单位：秒。
      open_angle_deg: 210.0 # servo_id=2，直接给角度数值。
      close_angle_deg: 50.0 # 下沉完成后合爪，再上浮。
      repeat_count: 3
      repeat_period: 0.1
      settle_seconds: 1.0
    micro_servo:
      zone_fraction: 0.30 # 环中心进入图像中心30%半径后切换微伺服增益。
      gain: 0.6 # 环进入微伺服区后的水平伺服增益。
    # 水平伺服完成并停车后采集新方向，到时立即通过外参转向并对爪。
    orientation_timeout: 2.0 # 优先这2秒的新样本；没有则用最后有效历史方向，到时立即转向。
    orientation_min_quality: 0.8 # 无效帧不清除已有有效方向；超时盲抓直接用最后世界轴的水平法向。
    yaw_tolerance_deg: 3.0
    yaw_gain: 1.2
    max_yaw_rate_deg_s: 10.0
