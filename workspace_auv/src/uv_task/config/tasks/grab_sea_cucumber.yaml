# 海参抓取任务配置。任务名：grab_sea_cucumber。
# 单独加载：mission_file:=<本文件的绝对路径>（需先完成 START）。
# 自动执行 START：加载 config/missions/grab_sea_cucumber.yaml 任务链。
# 参数复核标记（2026-10-11；本次只补充注释，不改变运行值）：
# [P0-实测] 优先确认现场几何/坐标基准；候选值不能视为已经标定。
# [P1-试调] 根据新录像、轨迹与任务时间戳逐项试调，每次只改变一组相关参数。
# [代码待修] 当前实现存在耦合或流程问题，调 YAML 只能缓解，不能完成修复。
# [不生效] 兼容参数或当前舵机未使用；修改不会产生所期待的效果。
# 旧的“[我填的占位值]”保留，表示现场数据仍需替换或确认。
# 优先顺序：爪子/相机几何与投影距离 → XY修正开关/框心坐标 → 下压/离底 → 高度/计数 → 时间预算。
# 占位值是有效配置；注释不会阻止程序执行，参数检查也不能确认现场标定是否正确。
# 配置说明：workspace_auv/docs/real_camera_and_physical_parameters.md 的海参任务章节。
# 执行顺序：前往搜索区 → 视觉居中 → 抓前计数 → 夹爪补偿 → 连续下压
# → 近底推力离底/速度上浮 → 可选任务odom平移 → 水平回观察位 → 抓后计数 → 投放/返回。
# 坐标约定：odom是START后坐标系；body是当前艇体系，x向前、y向右、z向下。
# 修改后重启task_runner才生效；加载源码绝对路径时仅修改YAML无需重新build。
task: grab_sea_cucumber

params:
  # 必填：当前分割模型中海参的类别编号，不能使用抓球类别代替。
  sea_cucumber_class_id: 2 # [我填的占位值] 按当前真机模型的 trepang=2 填写，需核对实际模型。
  # [P0-实测] 用当前模型标签和下视分割录像核对2=海参、4=收集框；阈值不能修正类别映射错误。
  image_width: 640   # 每目宽度，必须与真实下视标定一致。
  image_height: 480  # 每目高度。
  # 双目拼接总尺寸是1280×480，这里填640×480，不能填写拼接宽度1280。
  # 双目整体物理绕AUV yaw旋转180°；不是预览图像软件旋转角度。
  # camera发布掩膜已恢复原始标定像素，因此此补偿必须保留；原安装可填0。
  down_camera_mount_yaw_deg: 180.0
  # [P0-实测] 小步水平移动核对像素误差方向；仅相机物理倒装才使用180，勿因预览旋转再补一次。

  expected_count: 5            # 累计视觉数量减少的目标，不代表已验证的投放数量。
  total_timeout_seconds: 365.0 # 整个任务的时间预算，单位秒。
  # [P1-试调] 初次排障建议 expected_count=1，跑通抓取/复检/投放，再恢复5。
  # 365秒不是5轮必然够用：按首次移动+各轮对准/计数/补偿/下压/上浮/往返实测耗时加余量。
  # 若5轮实测总时间超过365，才提高总预算；增大局部超时不能突破本项预算。
  # 包含首次移动、视觉等待、下压、上浮、运输与重试；不包含任务链前面的START。
  max_failed_attempts: 3       # 数量未减少时，允许初次失败后的重试次数。
  # [P1-试调] 调试可先用1，减少在同一定位/高度问题下反复下压；稳定后再恢复3。
  # 同时用于连续视觉失败的重试预算：对准超时、抓前计数不足不会立即结束任务。
  # 值3表示初次失败后最多重试3次，连续第4次失败才退出；有效复检后重新计数。
  # 抓取数量不变的重试与连续视觉失败分别计数，最终仍受总超时约束。
  # 抓后计数未知：先投放可能携带的海参，再返回复查，不虚增确认数量。

  search:
    # 必填：海参抓取区的观察位姿，格式为 [x, y, z, yaw_deg]。
    # 使用本次 START 后的 odom 坐标：x 沿初始化艇头方向，y 向其右侧。
    # x/y/z 单位米；第三个值 z 是扫描目标深度，向下为正；yaw_deg 单位度。
    # 这是相对于 START 原点的目标位姿，不是相对于当前艇体的移动增量。
    pose: [0.35, -1.75, 0.2, -90.0] # [我填的占位值] 示例扫描位姿，需现场确认。
    # [P0-实测] 确认START原点、池底z、区域覆盖和航向；z=0.20是艇体参考深度，不是离底高度。
    # [代码待修] 失败重抓会沿用本轮实测观察深度，并未每轮重置到此z。
    # 旧记录出现0.21→0.48m逐轮变深；仅修改search.pose.z不能消除该累积。
    travel_timeout_seconds: 90.0       # 首次前往抓取区最多允许多久，单位秒。
    # 程序先用 WTRAVEL 前往上述位置和深度，再进行下视识别与水平对准。
    # 如目标深度更浅，先直接低速上浮到目标附近，再执行 WTRAVEL。
    # WTRAVEL 后由任务显式 SET 水平位置和 yaw_deg；实测归位后才开始扫描/投放。

  vision:
    min_confidence: 0.55                # 分割结果的最低置信度。
    # [P1-试调] 看带掩膜录像检查漏检、碎片和误检；不要为了凑数量直接降低阈值。
    # 只使用下视左目海参类别的有效segment多边形，不是只看检测框。
    detection_timeout: 0.8             # 检测结果允许的最大年龄，单位秒。
    # [代码待修] 实测PoseInfo超过1秒未更新即拒绝动作；该阈值在代码中，增大此检测超时不能修复位姿断流。
    # 年龄按检测到达任务节点的时间计算；另要求采集时间晚于本轮扫描/计数开始。
    # 若推理延迟大，应先检查camera管线，不宜仅扩大该值使用旧图像。
    pixel_tolerance_fraction: 0.04     # 对准误差阈值，越小要求越精确。
    # 实际判断：abs((u-cx)/fx)和abs((v-cy)/fy)均≤此值；不是图像宽高的百分比。

  servo:
    target_match_radius_px: 70.0       # 预测像素位置附近匹配同一目标，不按每帧最高置信度换目标。
    target_lost_wait_seconds: 4.0      # 锁定目标丢失后等待；超时结束本轮，不能立即改抓另一个。
    position_tolerance_m: 0.03         # 视觉微调独立XY到位容差；小步还要求至少走完一半。
    # [P1-试调] 若小步到位后仍明显残差，可在导航噪声允许时试0.01～0.02m；先确认能稳定到位。
    motion_settle_seconds: 0.3         # 实测XYZ/yaw在容差内持续此时间，才允许采集下一步图像。
    timeout: 30.0                      # 单轮视觉居中超时，单位秒；这里servo指视觉伺服，不是舵机。
    period: 0.5                       # 水平对准循环的等待时间，单位秒。
    log_period: 0.5                    # 对准日志打印间隔，单位秒。
    hold_seconds: 0.5                  # 进入对准容差后保持多久，单位秒。
    # 离开容差或目标检测不可用时重新计时，完成后记录抓前观察位姿。
    projection_depth_m: 0.8            # 图像换算参考距离；不是实际运动目标深度。
    # [P0-实测] 近水平且目标在池底时，D≈floor_z_m-(robot_z+下视左光心body.z)。
    # 当前名义1.20-(0.20+0.0645)=0.9355m，明显不同于0.8；核对深度基准/目标平面后再改。
    # 爪子接触点z=0.29不能代替相机z=0.0645；艇姿变化和重抓高度变化也会改变真实D。
    # 是相机到目标的近似距离，不是AUV水深；距离估计过大会放大横向步长。
    gain: 0.5                          # 图像偏差对应的水平修正增益。
    max_step_m: 0.08                   # 单次水平修正最大长度，单位米。
    # [P1-试调] 若录像显示越过安全区或来回振荡，可先试0.03～0.05m、gain=0.3～0.5。
    # 海参和收集框共用这组步长/增益；先校准投影距离，勿用小步长掩盖错误几何。
    # 限制修正目标的水平向量长度，不是速度或推力上限。
    position_command_timeout: 30.0      # 单次 SET/BMOVE 超时，单位秒。
    # 同时用于视觉SET和夹爪偏置BMOVE；当前已经是30秒，不是旧默认2秒。
    # [P1-试调] 以实测单步/偏置到位时间加余量设置；30秒超时仍失败时先查导航/控制，不继续盲目加长。

  gripper:
    servo_id: 1                        # 1=原圆盘爪；2=前视相机下方新夹爪。只改这里切换方案。
    contact_body_xyz: [-0.430, 0.0, 0.290] # 舵机1接触参考点，body米；名义机械位置，需实测有效接触点。
    # [P0-实测] 标定实际接触/携带物最低点，并核对姿态变化时离底高度；不要只量机构中心。
    # 当前左光心(-0.130,+0.030)与offset(+0.30,+0.10)推算有效抓取XY=(-0.430,-0.070)。
    # 这里的接触参考y=0与该推算相差7cm：确认是否同一有效接触点，再统一几何；勿直接改成名义值。
    # 仅参与离底高度计算；水平抓取继续使用offset_x/y，舵机2使用自身安装坐标。
    close_wait_seconds: 0.5             # 舵机2下压完成闭合后等待，再上浮；舵机1不使用。
    # 舵机1专用：从相机对准位置移到夹爪对准位置所需的艇体补偿位移。
    offset_x_m: 0.30 # 当前前移补偿0.30m；单位米，正向前、负向后，需实测。
    offset_y_m: 0.1 # 当前向右补偿0.10m；单位米，正向右、负向左，需实测。
    # [P0-实测] 水平对准后用已知位置物体验证爪子实际落点；x/y均参与收集框投放投影。
    # 5cm安全余量不能覆盖未解释的7cm横向几何差；不可通过缩小余量强行通过。
    # 是艇体需要移动的补偿量，不一定等于夹爪安装坐标；摄像头yaw补偿不改变此值。
    # 配置和ZitServo线协议均使用度；任务内部弧度在发送出口转回度。
    pickup_angle_deg: 0.0              # 舵机1抓取/准备位置，单位度；当前固定为0。
    release_angle_deg: 90.0            # 舵机1释放位置，单位度；当前固定为90。
    # 最终话题angle发布0或90，不是π/2。
    # 发布命令不等于机械已到位，目前没有舵机实测位置闭环。
    settle_seconds: 5.0              # 补偿位移后等待稳定，单位秒。
    # [P1-试调] 这是固定等待，不保证姿态/位置稳定；按录像和位姿连续稳定时长决定是否调整。
    servo2:
      open_angle_deg: 270.0             # 抓前张开、投放释放，话题servo_id=2、angle=270。
      close_angle_deg: 150.0            # START初始闭合、下压后夹住，再上浮运输。
      # 以下均是物理安装后的body坐标：x向前、y向右、z向下，单位米。
      # 下视中心Cd=(-0.130,0,0.0645)m，双目距离0.060m，各目距中心0.030m。
      # 当前下视物理绕yaw倒装180°：原始左目在body +y，右目在body -y。
      front_camera_body_xyz: [0.230, 0.0, 0.076]
      down_camera_body_xyz: [-0.130, 0.030, 0.0645] # 使用下视左目光心，不是双目中点。
      gripper_from_front_xyz: [0.05, 0.0, 0.10] # 相对前视中点：向前5cm、向下10cm，需实测。
      # 舵机2仍使用下视海参掩膜对准，再自动补偿camera_xy-gripper_xy。
      # 当前配置抓取点=(0.280,0,0.176)m，给出BMOVE(-0.410,+0.030)m。
      # [P0-实测/切换舵机2时] 上述三组安装坐标、150/270度角和close_wait均须验证；servo_id=1时不启用。
      # 不使用上面的舵机1 offset/pickup/release参数，安装yaw补偿不会重复作用于安装坐标。
      # 近底开环高度计算以新夹爪抓取点为参考，z偏置自动取front.z+相对z=0.176m。

  descent:
    # 下压方式：直接发送机体正z速度，不经过BasicMotion的位置步进。
    speed_mps: 0.50 # 现场值保留；正值向下，连续速度下压，不再使用旧速度限幅。
    # [P1-试调] 0.50m/s是速度段指令，不能据此认定接触速度；以录像核对接近池底时实际速度和姿态。
    # 如需试更慢接近，可从0.10～0.20m/s候选开始，但必须同步重算下压总时长。
    duration_seconds: 5.3 # 现场值保留；一次连续执行，实际行程需现场核对。
    # [P1-试调] 开环启用时此值覆盖“接近门限+纯推力保持”，并非独立的速度段时长。
    # 旧首轮接近耗时约4.635秒，5.3秒只剩约0.666秒推力，未达到press_thrust_seconds=1。
    # 建议按实测到门限时间+期望推力时长+收尾余量设置；降低速度后不能照搬5.3秒。
    max_press_distance_m: 2.0 # 兼容旧配置；当前不作限幅，也不是触底保护。
    # [不生效] 调小此值不会限制海参任务下压距离；接触停止/行程约束需要代码支持。
    # 无实时触底停止；speed×duration只是预计行程，不能保证实际压到目标。
    # 旧速度模式预计行程speed×duration；开环模式不可用速度×时间推算行程。
    # “连续下压”并不保证实际速度/推力；仍由MCU速度环执行，需现场观测。
    publish_period: 0.05               # 下压速度指令发布间隔，单位秒。
    # 0.05秒对应20Hz；结束、外部停止或异常时发零速度，随后开始极慢上浮。

  ascent:
    speed_mps: 0.05                    # 现场值保留：速度环上浮上限5cm/s，近目标减速。
    # 填正数，程序发送负z速度；近底开环启用时先使用lift_thrust离底。
    publish_period: 0.05               # 20Hz直接发送/zit6/cmd/setpoint，绕过位置步进。
    tolerance_m: 0.05                 # 到位后发送零速度，不发向下位置纠偏。
    # [P1-试调] 可先试0.01～0.02m以减小每轮提前结束量；收紧后近目标上浮更慢，需重估时间预算。
    # [代码待修] 这只能缓解，无法取代每轮恢复固定观察深度；过浅时当前不会主动向下纠偏。
    # 单位米；实测深度≤目标深度+此值即可结束上浮，不因上浮过头再向下压。
    # 抓后目标是抓前记录的观察深度；运输到更浅位置时也复用这段低速上浮。
    # 仍走MCU速度环，不保证零速度制动时没有反向推力；限推力需固件支持。

  counting:
    frames: 3                          # 每次计数收集的新消息数，至少 2。
    # [P1-试调] 先统一抓前/抓后高度和视野，再考虑5帧；当前前取最小/后取最大，增加帧数不保证更准确。
    # 同一海参掩膜碎片可能被计为多只，参数不能替代实例关联或稳定计数逻辑。
    # 抓前取这些帧中的最小数量，抓后取最大数量，减少漏检造成的虚假抓取成功。
    # 超时但已收到至少2个新鲜计数帧时，允许使用这2帧；不足2帧则本轮重试。
    timeout_seconds: 20.0              # 单次计数超时，单位秒。
    # [P1-试调] 依据新鲜分割帧间隔设置，前/后两次最坏可占40秒；必须计入每轮总预算。
    # 抓前计数缺失/为0：重试，不下压；抓后计数未知：先投放可能携带的海参再复查。

  delivery:
    # 必填：释放时 AUV 的目标位姿，格式为 [x, y, z, yaw_deg]。
    # x/y/z 单位米，使用本次 START 后的 odom 坐标，z 向下为正。
    # 第三个值 z 就是投放深度；必须考虑夹爪位置和释放高度。
    pose: [0.3, 0.0, 0.2, 0.0] # [我填的占位值] 示例投放位姿 [x, y, z, yaw_deg]，需现场确认。
    # [P0-实测] 当前视觉失败会回到这里并直接释放；须验证爪子落点位于框内，而非只确认艇体到位。
    # 此位姿是艇体位置，collection_center_odom_xy是框心，二者不必相同。
    timeout_seconds: 90.0              # 每次运输超时，单位秒。
    # [P1-试调] 运输预算包含上浮、航行和水平到位；当前上浮上限5cm/s，近目标还会减速。
    # 若今后改为1cm/s，上浮1m仅匀速段就需约100秒，90秒将不足。
    release_wait_seconds: 2.0          # 发送释放角度后等待多久，单位秒。
    # [P1-试调] 按录像测得的机械张开/海参脱离时间加余量；没有释放确认闭环，延时不等于成功。
    # 只等待，不验证是否真正脱离夹爪；投放次数不是实际成功投放数量。

  # 近底改为ACTUATOR纯推力，全部水平/姿态轴推力为0，不维持XY或姿态。
  # [P0-实测] 当前开关已经为true：必须核对floor_z、参考点和两种推力，不能把占位值当已标定。
  # 未标定时应暂停近底接触试验；改为false只是恢复速度下压，并不自动增加触底保护。
  near_floor_open_loop: true
  floor_z_m: 1.2                     # 待填：START后odom系池底z；必须与机器人深度同基准。
  bottom_reference_offset_z_m: 0.1    # DVL/艇底参考点下伸量；与选定爪子旋转后的下伸量取最大值。
  # [P0-实测] 确认与robot_z采用同一原点；不是底跟踪有效范围，也不是对DVL漂移的数值补偿。
  open_loop_clearance_m: 0.20         # 最低参考点离底≤20cm后锁定开环下压；不会因DVL跳变回切。
  # 水平姿态、舵机1名义接触z=0.29时，切换艇体z约1.20-0.29-0.20=0.71m；pitch/roll会改变它。
  # [P0-实测] 验证实际进入推力时仍有预期离底余量；不要沿用旧日志z≈0.90作为正确门限。
  press_thrust: 0.2                   # 待填：(0,1]归一化z推力，正为下压；不是PWM/牛顿/速度。
  # [P1-试调] 通过录像/姿态和实际接触效果标定；无触底停止反馈，勿只增大推力或保持时间追求数量减少。
  lift_thrust: -0.3                    # 待填：[-1,0)小负推力，近底慢慢离底；需实测速度。
  # [P1-试调] |-0.3|大于下压0.2，不能称其已验证为慢速；在能够可靠离底前提下逐级减小绝对值。
  # 记录离底速度、yaw/roll/pitch变化和携带物是否滑落；纯推力阶段全部姿态/水平轴为0。
  press_thrust_seconds: 1.0           # 进入20cm后推力持续秒数；仍受descent.duration_seconds总预算限制。
  # [P0-策略] 旧记录存在真实横移的可能及约14～23度航向变化；尚不能把B→C全部变化归为DVL漂移。
  # 建议排障对照时先设false并观察导航/视觉；关闭会保留漂移，不能保证真实回到原抓取点。
  # [代码待修] 最终需固定视觉地标等独立观测来决定修正量；此开关既不冻结DVL，也不修正yaw。
  restore_pre_press_odom_xy: true     # 开启即假设下压前后XY差全是DVL漂移；有水流时不要开。

  collection_visual_align: true       # 到delivery.pose后将实际爪子落点移入可见收集框内部，随后释放。
  collection_release_margin_m: 0.05  # 爪子落点到可见掩膜/图像边缘的余量；应覆盖携带物尺寸和投影误差。
  # [P0-实测] 建议至少覆盖携带物水平外廓半径+投影/落点误差；若安全区域太小，应改变观察位/高度。
  # 不建议为了让裁切框通过而减小到接近0；当前没有自动上浮找框或大范围视觉搜索。
  # 允许框被裁切；类别4掩膜必须代表可投放内部区域。视觉已补偿夹爪，不再追加offset。
  collection_class_id: 4              # YOLO-seg收集框/platform类别。
  collection_projection_depth_m: 0.8  # 待校准：左相机到收集框平面的距离m，非水深。
  # [P0-实测] 若框口/投放面高于池底，D=投放面z-(robot_z+相机body.z)，不能直接复用海参池底D。
  # 同时用于落点投影、5cm像素换算和框心反投影，错误会影响投放与odom校正两条链路。
  # [P1-试调] 当前未配置collection_hold_seconds，代码默认0（不要求持续保持）。
  # 可在本层加入 collection_hold_seconds: 0.5，要求爪子安全落点在新鲜有效帧中持续满足条件。
  # servo.hold_seconds不控制收集框保持时间；collection_pixel_tolerance_fraction也不能放宽内部安全余量。
  collection_correct_odom_xy: true   # 完整框才能用框心地标修正任务odom；裁切框跳过校正、允许视觉投放。
  # [P0-策略] 框心未标定或地标采样不稳定时建议先设false，保留collection_visual_align=true验证投放。
  # [代码待修] 当前完整框地标采样/校正失败会撤销已通过的投放对准，随后触发配置点直接释放。
  # 计划将投放判定与坐标校正解耦；目前没有“校正失败只跳过校正”的独立YAML开关。
  collection_center_odom_xy: [ 0.0, 0.0]        # 开启前填写已测定的固定框心[x,y]，本次START坐标系。
  # [P0-实测] [0,0]仅在START艇体原点恰为已知框心时成立；每次改变START位置/航向须重新换算。
  collection_camera_body_xy: [-0.130, 0.030] # Cd中心+倒装左目半基线，单位m，与上面的左光心一致。
  # [P0-实测] 核对左光心而非双目中点；这里只用于地标反投影，爪子落点主要由gripper.offset_x/y决定。
  odom_correction_max_m: 1.0           # 超过此平移拒绝校正，不把误识别直接写入坐标系。
  # [P1-试调] 1m门限不能证明修正可信；按独立地标误差与正常偏移分布设更小上限。
  # 小范围排障可试0.10～0.20m，但两种XY校正共用该上限；旧约0.276m差会被拒绝并中止对应流程。

  return_timeout: 300.0                 # 慢速上浮及水平回位预算；仍受任务总超时约束。
  # 抓后恢复观察位的预算，不是运输预算；当前速度上限0.05m/s，近目标减速使耗时超过匀速估算。
  # [P1-试调] 300秒是上限而非实际保留时间，还要给运输/投放留预算；以实测正常回位时间加余量设置。
  # 任何局部超时都不能延长当前365秒总预算；调慢上浮或收紧深度容差时同步复核总预算。
