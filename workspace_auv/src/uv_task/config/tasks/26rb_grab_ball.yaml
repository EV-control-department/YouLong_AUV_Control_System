task: 26rb_grab_golf # 旧文件名保留，使用现有抓高尔夫球任务。

params:
  # 使用 robotcup20260901.yaml 中的 canonical detector class name。
  golf_color: pink_golf
  collection_frame_class: collection_frame_down

  # 到达任务位后先看置物盘；对准盘后再观察球。
  collection_frame_observe_seconds: 2.0
  golf_observe_seconds: 2.0

  # frame 和球均用 XY 速度伺服，全程保持进入 frame 伺服时的实测深度。
  vision:
    detection_timeout: 0.8 # 检测结果最大允许年龄，单位：秒。
    pixel_tolerance_fraction: 0.02 # 目标中心归一化误差容差。
  servo:
    timeout: 30.0 # 单次水平视觉伺服最长时间，单位：秒。
    period: 0.15 # 水平伺服周期，单位：秒。
    log_period: 0.5 # 水平伺服日志周期，单位：秒。
    hold_seconds: 0.5 # 球心进入容差后的保持时间，单位：秒。
    projection_depth_m: 0.6 # 像素误差投影参考深度，单位：米。
    gain: 0.8 # 像素误差到水平速度的增益，单位：1/秒。
    max_speed_mps: 0.08 # 水平合速度上限，单位：米/秒。
    depth_gain: 0.8 # 实测深度偏差到世界垂直速度的增益，单位：1/秒。
    max_vertical_speed_mps: 0.08 # 定深修正最大垂直速度，单位：米/秒。
    depth_tolerance_m: 0.03 # 进入居中保持需同时满足的深度误差，单位：米。
    position_command_timeout: 10.0 # 伺服结束定点保持/夹爪外参 BMOVE 超时，单位：秒。

  # 夹爪舵机 1 先重复发送到 0 rad，降低单次消息丢失的影响。
  claw:
    prepare_angle_rad: 0.0
    prepare_repeat_count: 3
    prepare_repeat_period: 0.1
  light:
    pulse_seconds: 0.35
    gap_seconds: 0.25
  settle_seconds: 1.0 # 外参平移后，等待艇体和夹爪稳定。

  # 抓取动作：下潜 5 秒、上浮 5 秒，再回到记录位姿。
  descent:
    speed_mps: 0.1 # 下沉速度，NED 正值向下，单位：米/秒。
    duration_seconds: 5.0
  ascent:
    speed_mps: 0.1 # 上浮速度，NED 负值向上，单位：米/秒。
    duration_seconds: 5.0
  vertical_publish_period: 0.05 # 速度指令周期，单位：秒。
  return_timeout: 60.0 # 回到水平伺服位置的最长时间，单位：秒。

  # 返回水平位置后检查球是否仍然存在；存在则重新执行完整抓取流程。
  verification:
    timeout: 5.0 # 抓取结果检查最长时间，单位：秒。
    absence_hold_seconds: 0.8 # 连续看不到目标多久才确认已抓走，单位：秒。
    max_retries: 2 # 最多重试 2 次，共执行 3 次抓取。
