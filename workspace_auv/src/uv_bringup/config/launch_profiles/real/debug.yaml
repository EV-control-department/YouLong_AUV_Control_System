schema_version: 1
runtime: real
preset: debug
description: Enable AI and record unannotated go2rtc video, rosbag, and session logs.
arguments:
  profile: real_safe
  enable_hardware: "true"
  enable_ai: "true"
  enable_motion: "false"
  enable_nav: "false"
  enable_task: "false"
  enable_stream: "true"
  record_session: "true"
  record_mode: go2rtc
  go2rtc_stream_mode: unannotated
  go2rtc_video_format: jpeg
  record_use_sim_time: "false"
