# 真机任务准备模式：启动任务依赖的硬件、定位、运动控制、相机、AI 感知、go2rtc 和录制。
# real.launch.py 不启动 task_runner、不发送 BasicMotion START，也不读取任务状态。
# 任务进程由操作者在单独终端启动、停止和重启。
#
# 调用方式：
#   ros2 launch uv_bringup real.launch.py profile:=task
#
# 启动的主要节点/进程：
#   - model_class_publisher：发布类别映射，task_runner 启动前必须收到该消息。
#   - robot_state_publisher：发布真实 URDF 和相机静态 TF。
#   - uv_localization：发布 /auv/state/odom 和动态 TF。
#   - hw_manager：转发 ZIT6 命令/服务和状态，并监控 watchdog。
#   - basic_motion：拥有 ARM 心跳并提供 /auv/basic_motion Action Server。
#   - uv_camera：打开真实前视/下视相机。
#   - object_detector、object_localizer、object_estimator：提供检测、目标定位和轨迹。
#   - uv_stream/go2rtc：提供视频预览。
#   - uv_record_recorder：录制 go2rtc 视频、rosbag 和运行日志。
#   - task_runner：不由本 profile 启动；需要时单独执行：
#     ros2 launch uv_task task_launch.py camera_mode:=real
#
# profile:=task 只准备系统组件；是否启动任务由操作者单独决定。导航仍由 enable_nav=false 关闭。
schema_version: 1
runtime: real
profile: task
description: Prepare real AI and motion components for a separately managed task process.
arguments:
  enable_hardware: true
  enable_ai: true
  enable_motion: true
  enable_camera: true
  enable_nav: false
  enable_stream: true
  record_session: true
  record_mode: go2rtc
  go2rtc_stream_mode: unannotated
  go2rtc_video_format: jpeg
  record_use_sim_time: false
