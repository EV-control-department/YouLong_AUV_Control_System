schema_version: 1
runtime: real
profile: task
description: Run AI, motion control, and the default full mission with go2rtc recording.
arguments:
  enable_hardware: true
  enable_ai: true
  enable_motion: true
  enable_nav: false
  enable_task: true
  enable_stream: true
  record_session: true
  record_mode: go2rtc
  go2rtc_stream_mode: unannotated
  go2rtc_video_format: jpeg
  record_use_sim_time: false
