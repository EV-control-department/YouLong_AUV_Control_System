schema_version: 2
catalog_topic: /auv/sl_camera/cameras

# Each enabled item creates one capture worker and one Iceoryx2 publisher.
# Images remain in the device's original orientation, including stereo images.
cameras:
  - id: 1
    name: sl
    enabled: true
    device: /dev/video0
    ice_service: youlong/sl_camera/sl
    frame_id: sl_camera_optical_frame
    width: 1280
    height: 720
    fps: 30.0
    pixel_format: MJPG
    layout: mono
    startup_timeout_sec: 5.0
    reconnect_interval_sec: 1.0
    calibrations: []

  - id: 2
    name: down
    enabled: true
    # Verified on the AUV: index0 is /dev/video2 (Video Capture).
    # /dev/video3 is index1, a metadata-only interface, and cannot output images.
    device: /dev/v4l/by-id/usb-3D_USB_Camera_3D_USB_Camera-video-index0
    ice_service: youlong/sl_camera/down
    frame_id: down_camera_frame
    width: 2560
    height: 960
    fps: 30.0
    pixel_format: MJPG
    layout: stereo_sbs
    startup_timeout_sec: 5.0
    reconnect_interval_sec: 1.0
    calibrations: []

recording:
  output_root: ""
  video_fps: 30.0
  bag_duration: 10.0
  bag_storage: auto
