schema_version: 1
runtime: hil
profile: task
description: Enable the HIL mission stack and automatically execute the default RoboCup 2026 mission.
arguments:
  enable_ai: true
  enable_motion: true
  enable_nav: true
  enable_task: true
  gpu: true
  gpu_backend: auto
  enable_stream: true
  record_session: true
  record_mode: go2rtc
  go2rtc_stream_mode: unannotated
  go2rtc_video_format: jpeg
  record_use_sim_time: true
