schema_version: 1
runtime: sim
profile: debug
description: Enable AI and record unannotated go2rtc video, rosbag, and session logs.
arguments:
  enable_ai: true
  enable_motion: true
  enable_nav: false
  enable_task: false
  gpu: true
  gpu_backend: auto
  enable_stream: true
  enable_evaluation: true
  record_session: true
  record_mode: go2rtc
  go2rtc_stream_mode: unannotated
  go2rtc_video_format: jpeg
  record_use_sim_time: true
