schema_version: 1
runtime: hil
preset: record
description: Capture HIL source camera frames with uv_record raw mode.
arguments:
  profile: hil_lab
  enable_ai: "false"
  enable_motion: "false"
  enable_nav: "false"
  enable_task: "false"
  gpu: "true"
  gpu_backend: auto
  enable_stream: "false"
  record_session: "true"
  record_mode: raw
  record_use_sim_time: "true"
