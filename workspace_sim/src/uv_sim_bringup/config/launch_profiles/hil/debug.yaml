schema_version: 1
runtime: hil
preset: debug
description: Enable HIL AI and record unannotated go2rtc video, rosbag, and session logs.
arguments:
  profile: hil_lab
  enable_ai: "true"
  enable_motion: "false"
  enable_nav: "false"
  enable_task: "false"
  gpu: "true"
  gpu_backend: auto
  enable_stream: "true"
  record_session: "true"
  record_mode: go2rtc
  go2rtc_stream_mode: unannotated
  go2rtc_video_format: jpeg
  record_use_sim_time: "true"
