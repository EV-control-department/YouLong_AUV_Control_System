schema_version: 1
runtime: sim
preset: record
description: Capture source camera frames for dataset creation with uv_record raw mode.
arguments:
  profile: sim_dev
  enable_ai: "false"
  enable_motion: "true"
  enable_nav: "false"
  enable_task: "false"
  gpu: "true"
  gpu_backend: auto
  enable_stream: "false"
  enable_evaluation: "false"
  record_session: "true"
  record_mode: raw
  record_use_sim_time: "true"
