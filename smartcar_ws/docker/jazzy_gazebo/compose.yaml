services:
  ros2_gazebo:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartcar-ros2-jazzy-gazebo:course
    container_name: smartcar_ros2_jazzy_gazebo
    network_mode: host
    environment:
      ROS_LOCALHOST_ONLY: "1"
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ../../:/smartcar_ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "tail -f /dev/null"]
