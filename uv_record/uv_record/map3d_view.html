<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUV · 三维建图还原</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1622;color:#e9f1f6;font:14px/1.5 system-ui,sans-serif}
.shell{max-width:1600px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:3px;color:#7ed7d1}h1{font-size:25px;letter-spacing:1px;margin:5px 0}small,.muted{color:#93aaba}.badge{border:1px solid #395164;padding:6px 12px;border-radius:20px;color:#95e1d2}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:14px}button,select{font:inherit;color:#dceaf0;background:#192b3b;border:1px solid #304a5c;border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{border-color:#79d7d1}button.active{color:#0b2126;background:#89ded6;border-color:#89ded6}label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}input{accent-color:#89ded6}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:15px}.stage{position:relative;background:#102331;border:1px solid #284354;border-radius:14px;overflow:hidden}canvas{width:100%;height:570px;display:block;touch-action:none;cursor:grab}.corner{position:absolute;top:16px;left:18px;pointer-events:none;color:#cce1e8}.corner strong{font-size:15px}.corner small{display:block}.legend{position:absolute;bottom:15px;left:18px;display:flex;gap:14px;font-size:12px;color:#a9c1ce;pointer-events:none}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.hint{position:absolute;bottom:15px;right:15px;font-size:12px;color:#7d9aaa;pointer-events:none}
aside{background:#142635;border:1px solid #294353;border-radius:14px;padding:18px;overflow-wrap:anywhere}h2{font-size:16px;margin:0 0 10px}.stat{margin:14px 0;border-bottom:1px solid #2a4150;padding-bottom:12px}.stat b{font-size:24px;font-weight:500}.stat span{display:block;font-size:12px;color:#91adbd}.details{font-size:13px;color:#bed0da;white-space:pre-wrap}.notes{font-size:12px;color:#90aab9;margin-top:14px;line-height:1.8}.notes p{margin:6px 0}.warning{color:#efc275}.footer{color:#6f8b9e;font-size:11px;letter-spacing:1px;margin-top:14px}.empty{position:absolute;top:45%;left:10%;right:10%;text-align:center;color:#b9cdda;pointer-events:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}canvas{height:480px}aside{min-height:120px}.stat{display:inline-block;vertical-align:top;margin-right:20px}.hint{display:none}header{align-items:flex-start}.badge{display:none}.shell{padding:12px}}
</style>
<div class="shell">
<header><div><div class="eyebrow">AUV / MAPPING RECONSTRUCTION</div><h1>水下九宫格 · 三维复盘</h1><small>世界坐标还原 · 实物样式锥桶 · 标记与观测证据</small></div><span class="badge" id="verified">RECORDED DATA</span></header>
<div class="toolbar"><select id="run" aria-label="选择建图轮次"></select><button data-mode="visual" class="active">视觉融合</button><button data-mode="submission">实际提交</button><button id="home">立体视角</button><button id="top">俯视</button><button id="save">保存 PNG</button></div>
<div class="toolbar muted"><label><input id="points" type="checkbox" checked>原始观测点</label><label><input id="path" type="checkbox">整段轨迹</label><label><input id="labels" type="checkbox" checked>编号与标记 ID</label><label><input id="guides" type="checkbox" checked>格点与坐标参考</label></div>
<div class="layout"><div class="stage"><canvas id="canvas" aria-label="可旋转的三维九宫格建图"></canvas><div class="corner"><strong id="scene-title"></strong><small id="scene-subtitle"></small></div><div class="legend"><span><i style="background:#78e4d0"></i>视觉记录</span><span><i style="background:#eec16a"></i>提交 / 非视觉来源</span><span><i style="background:#f9838e"></i>拒绝观测</span></div><div class="hint">拖动旋转 · 滚轮缩放 · 点击目标查证据</div><div class="empty" id="empty" hidden></div></div>
<aside><h2>场景证据</h2><div class="stat"><b id="count">—</b><span>有坐标的锥桶 / 已分类锥桶</span></div><div class="stat"><b id="tag-id">—</b><span>ArUco / AprilTag ID</span></div><div class="stat"><b id="grid-size">—</b><span>九宫格边长 · 世界系</span></div><div class="details" id="detail">点击锥桶或标记查看原始坐标与来源。</div></aside></div>
<div class="notes" id="notes"></div><div class="footer">OFFLINE / NO NETWORK REQUIRED · 坐标、类别和来源来自录制；外形是尺寸模型。</div>
</div>
<script id="scene-data" type="application/json">__SCENE_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('scene-data').textContent),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),names={visual:'视觉融合结果',submission:'实际提交接口结果'};
let sceneIndex=Math.max(0,DATA.scenes.length-1),mode='visual',az=-.35,el=.82,zoom=1,W=900,H=570,faces=[],lines=[],texts=[],dots=[],hits=[],origin=[0,0,0],radius=2,drag=null,selected=null;
for(let i=0;i<DATA.scenes.length;i++){const scene=DATA.scenes[i];if(scene.state!=='initializing'&&(scene.modes.visual.objects.length||scene.modes.visual.tag))sceneIndex=i}
const dot=(a,b)=>a.reduce((sum,v,i)=>sum+v*b[i],0),sub=(a,b)=>a.map((v,i)=>v-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>{const n=Math.hypot(...a)||1;return a.map(v=>v/n)},mix=(a,b,t)=>a.map((v,i)=>v*(1-t)+b[i]*t);
const positionOk=p=>Array.isArray(p)&&p.length>=3&&p.slice(0,3).every(Number.isFinite);
const world=p=>[p[1],p[0],(current()?.grid.floor??0)-p[2]];
function current(){return DATA.scenes[sceneIndex]}function active(){return current()?.modes[mode]}
function project(p){const q=sub(p,origin),dir=[Math.sin(az)*Math.cos(el),-Math.cos(az)*Math.cos(el),Math.sin(el)],right=[Math.cos(az),Math.sin(az),0],up=[-Math.sin(az)*Math.sin(el),Math.cos(az)*Math.sin(el),Math.cos(el)];const depth=dot(q,dir),dist=radius*5,scale=Math.min(W,H)*.73/radius*zoom*dist/Math.max(dist*.15,dist-depth);return [W*.50+dot(q,right)*scale,H*.56-dot(q,up)*scale,depth]}
function polygon(points,color,options={}){faces.push({points,color,layer:1,...options})}
function line(points,color,width=1,dash=[]){lines.push({points,color,width,dash})}
function text(p,title,color='#c9dbe3',size=12){texts.push({p,title,color,size})}
function circle(p,color,size=2){dots.push({p,color,size})}
function flatQuad(center,size,yaw,z){const rot=angle=>[Math.cos(angle),Math.sin(angle)];return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([x,y])=>[center[0]+(x*Math.cos(yaw)-y*Math.sin(yaw))*size/2,center[1]+(x*Math.sin(yaw)+y*Math.cos(yaw))*size/2,z])}
function box(c,size,height,color,yaw=0){const bottom=flatQuad(c,size,yaw,c[2]),top=flatQuad(c,size,yaw,c[2]+height);polygon(top,color);for(let i=0;i<4;i++)polygon([bottom[i],bottom[(i+1)%4],top[(i+1)%4],top[i]],color)}
function ground(scene){const g=scene.grid,yaw=-g.yaw*Math.PI/180,c=positionOk(g.center)?world(g.center):null;
 if(c&&g.side&&Number.isFinite(g.floor)){c[2]=0;box([c[0],c[1],-.075],g.side+.08,.06,'#1a4d58',yaw);for(const face of faces)face.layer=-3;
  for(const cell of scene.cells){if(!positionOk(cell.center))continue;const p=world(cell.center);p[2]=-.009;polygon(flatQuad(p,g.side/3-.018,yaw,p[2]),(Number(cell.id)%2===0)?'#265565':'#234e5e',{unlit:true,layer:-2});if($('guides').checked){const q=flatQuad(p,g.side/3-.018,yaw,p[2]+.003);line([...q,q[0]],'#57818c',.6);circle([p[0],p[1],.008],'#78969d',2)}if($('labels').checked){const corner=flatQuad(p,g.side/3-.10,yaw,.008)[0];text(corner,'0'+cell.id,'#9fc2ce',12)}}
  if($('guides').checked){const p=[c[0]-g.side*.7,c[1]-g.side*.7,0],s=g.side*.25;line([p,[p[0],p[1]+s,0]],'#7acb9a',2);text([p[0],p[1]+s+.07,0],'+X','#7acb9a');line([p,[p[0]+s,p[1],0]],'#78b7ee',2);text([p[0]+s+.09,p[1],0],'+Y','#78b7ee');line([p,[p[0],p[1],s]],'#e6b376',2);text([p[0],p[1],s+.07],'−Z / UP','#e6b376',10);text([c[0],c[1]-g.side*.66,0],g.side.toFixed(2)+' m','#a0c3cb',12)}}
 else if($('guides').checked){for(const cell of scene.cells){if(!positionOk(cell.center))continue;const p=world(cell.center);circle(p,'#718f9b',4);text(p,'格 '+cell.id)}}
}
function cone(object){if(!positionOk(object.position))return;const p=world(object.position),h=.50,r=object.kind===0?.175:.14,n=object.kind===0?4:32,yaw=-current().grid.yaw*Math.PI/180+(object.kind===0?Math.PI/4:0),base=p[2]-(object.anchor==='center'?h/2:0),fallback=String(object.source).includes('fallback');
 const at=(level,i)=>{const radius=r*(1-level)+.008*level,angle=i/n*Math.PI*2+yaw;return [p[0]+Math.cos(angle)*radius*(object.kind===0?Math.SQRT2:1),p[1]+Math.sin(angle)*radius*(object.kind===0?Math.SQRT2:1),base+h*level]};
 const baseRing=Array.from({length:48},(_,i)=>[p[0]+Math.cos(i/48*Math.PI*2)*(r+.025),p[1]+Math.sin(i/48*Math.PI*2)*(r+.025),base+.004]);line([...baseRing,baseRing[0]],fallback?'#eec16a':'#78e4d0',2.1,fallback?[4,4]:[]);
 if(object.kind===0){box([p[0],p[1],base],.35,.023,'#343c3c',-current().grid.yaw*Math.PI/180);for(let i=0;i<n;i++)polygon([at(0,i),at(0,i+1),at(1,i+1),at(1,i)],'#f3c619',{warningStripe:true})}
 else {const stops=[0,.05,.27,.40,.61,.74,1];for(let j=0;j<stops.length-1;j++){const color=(j===2||j===4)?'#edeedc':'#f16b28';for(let i=0;i<n;i++)polygon([at(stops[j],i),at(stops[j],i+1),at(stops[j+1],i+1),at(stops[j+1],i)],color)}polygon(Array.from({length:n},(_,i)=>at(0,i)),'#bc4826')}
 const cap=Array.from({length:n},(_,i)=>at(1,i));polygon(cap,object.kind===0?'#efd74b':'#d96632');
 const tip=[p[0],p[1],base+h+.08],label=`格 ${object.cell} · ${object.kind===0?'方形':'圆形'}`;
 if($('labels').checked)text(tip,label,fallback?'#edc987':'#d0e6e5',12);
 hits.push({point:tip,object,type:'cone'});
 if($('guides').checked){const cell=current().cells.find(c=>String(c.id)===String(object.cell));if(cell&&positionOk(cell.center)){const c=world(cell.center);line([[p[0],p[1],base],c],'#7eafbc',1,[3,4])}}
}
function marker(tag){if(!tag||!positionOk(tag.position))return;const p=world(tag.position),yaw=-current().grid.yaw*Math.PI/180,size=.30,pattern=tag.pattern;p[2]+=.006;const before=faces.length;box(p,size+.045,.008,'#e4ece6',yaw);for(let i=before;i<faces.length;i++)faces[i].layer=2;const fallback=String(tag.source).includes('fallback'),border=flatQuad(p,size+.075,yaw,p[2]+.01);line([...border,border[0]],fallback?'#eec16a':'#8be5dc',2,fallback?[4,4]:[]);
 if(pattern){const n=pattern.length,step=size/n;for(let row=0;row<n;row++)for(let col=0;col<n;col++){const a=(col/n-.5)*size,b=(row/n-.5)*size;const corners=[[a,b],[a+step,b],[a+step,b+step],[a,b+step]].map(([x,y])=>[p[0]+x*Math.cos(yaw)-y*Math.sin(yaw),p[1]+x*Math.sin(yaw)+y*Math.cos(yaw),p[2]+.009]);polygon(corners,pattern[row][col]?'#f3f6ee':'#121a20',{unlit:true,layer:3})}}
 else {polygon(flatQuad(p,size,yaw,p[2]+.009),'#738994',{unlit:true});text([p[0],p[1],p[2]+.018],'码纹不可用','#edf2ee',9)}
 const label=[p[0],p[1],p[2]+.19];if($('labels').checked)text(label,'TAG '+tag.id,fallback?'#eec16a':'#a4e9e0',13);line([p,label],fallback?'#eec16a':'#81c8bf',1);hits.push({point:label,object:tag,type:'tag'});
}
function fit(){const scene=current();if(!scene)return;let pts=[];if(positionOk(scene.grid.center)&&scene.grid.side){const c=world(scene.grid.center),s=scene.grid.side*.75;pts.push([c[0]-s,c[1]-s,0],[c[0]+s,c[1]+s,.6])}else for(const cell of scene.cells)if(positionOk(cell.center))pts.push(world(cell.center));for(const o of active()?.objects||[])if(positionOk(o.position))pts.push(world(o.position));if(positionOk(active()?.tag?.position))pts.push(world(active().tag.position));if($('path').checked)for(const row of DATA.trajectory)pts.push(world(row.position));if(!pts.length){origin=[0,0,0];radius=2;return}const low=[0,1,2].map(i=>Math.min(...pts.map(p=>p[i]))),high=[0,1,2].map(i=>Math.max(...pts.map(p=>p[i])));origin=mix(low,high,.5);origin[2]=Math.max(0,origin[2]);radius=Math.max(.8,Math.hypot(high[0]-low[0],high[1]-low[1],high[2]-low[2])*.5);zoom=1}
function shade(color,normal){const n=unit(normal),light=unit([-.6,-.4,1]),amount=.65+.35*Math.abs(dot(n,light));return '#'+[1,3,5].map(i=>Math.round(parseInt(color.slice(i,i+2),16)*amount).toString(16).padStart(2,'0')).join('')}
function draw(){const dpr=window.devicePixelRatio||1;W=canvas.clientWidth;H=canvas.clientHeight;if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#142e3e');gradient.addColorStop(.7,'#102432');gradient.addColorStop(1,'#0e1b2a');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);ctx.fillStyle='#567e8e';for(let i=0;i<70;i++){ctx.globalAlpha=.12;ctx.beginPath();ctx.arc((i*157)%W,(i*73)%H,(i%3)*.4+.6,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 faces=[];lines=[];texts=[];dots=[];hits=[];const scene=current(),view=active();if(!scene||!view)return;ground(scene);for(const object of view.objects)cone(object);marker(view.tag);if($('points').checked&&mode==='visual'){for(const cell of scene.cells)for(const sample of cell.measurements||[]){const pos=Array.isArray(sample)?sample:sample.position;if(positionOk(pos))circle(world(pos),sample.accepted===false?'#f9838e':'#74ddc9',2)}}if($('path').checked&&DATA.trajectory.length>1)line(DATA.trajectory.map(row=>world(row.position)),'#7daecc',1.3);
 faces.sort((a,b)=>a.layer-b.layer||dotDepth(a)-dotDepth(b));
 for(const face of faces){const pts=face.points.map(project);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();const normal=cross(sub(face.points[1],face.points[0]),sub(face.points[2],face.points[0]));ctx.fillStyle=face.unlit?face.color:shade(face.color,normal);ctx.fill();if(face.warningStripe){ctx.save();ctx.clip();const minX=Math.min(...pts.map(p=>p[0])),maxX=Math.max(...pts.map(p=>p[0])),minY=Math.min(...pts.map(p=>p[1])),maxY=Math.max(...pts.map(p=>p[1]));ctx.strokeStyle='#252e2d';ctx.lineWidth=8*zoom;for(let t=minX-(maxY-minY);t<maxX+(maxY-minY);t+=19*zoom){ctx.beginPath();ctx.moveTo(t,minY);ctx.lineTo(t+(maxY-minY),maxY);ctx.stroke()}ctx.restore()}}
 for(const item of lines){ctx.beginPath();item.points.map(project).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=item.color;ctx.lineWidth=item.width;ctx.setLineDash(item.dash);ctx.stroke()}ctx.setLineDash([]);
 for(const item of dots){const p=project(item.p);ctx.beginPath();ctx.fillStyle=item.color;ctx.arc(p[0],p[1],item.size,0,Math.PI*2);ctx.fill()}
 for(const item of texts){const p=project(item.p);ctx.font=`${item.size}px system-ui`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#102330';ctx.strokeText(item.title,p[0],p[1]);ctx.fillStyle=item.color;ctx.fillText(item.title,p[0],p[1])}
 if(selected){const hit=hits.find(h=>h.type===selected.type&&String(h.object.cell??h.object.id)===selected.key);if(hit){const p=project(hit.point);ctx.beginPath();ctx.arc(p[0],p[1]-5,22,0,Math.PI*2);ctx.strokeStyle='#e5f4e6';ctx.lineWidth=1;ctx.stroke()}}
}
function dotDepth(face){return face.points.reduce((sum,p)=>sum+project(p)[2],0)/face.points.length}
function updateInfo(){const scene=current(),view=active();$('empty').hidden=!!scene;if(!scene){$('empty').textContent='没有建图快照。生成报告时会保留已有轨迹和视觉诊断。';draw();return}
 const missing=view.objects.filter(o=>!positionOk(o.position)).map(o=>o.cell);$('empty').hidden=view.available;if(!view.available)$('empty').textContent='未记录该结果；场景仅保留九宫格参考。';
 $('scene-title').textContent=names[mode];$('scene-subtitle').textContent=`第 ${sceneIndex+1} 轮 · ${scene.state||'未知状态'} · ${scene.frame_id}`;
 $('count').textContent=`${view.objects.length-missing.length} / ${view.objects.length}`;$('tag-id').textContent=view.tag?.id??'未记录';$('grid-size').textContent=scene.grid.side?scene.grid.side.toFixed(2)+' m':'未记录';$('verified').textContent=scene.verified&&mode==='visual'?'VERIFIED COMPLETE':'来源：'+names[mode];
 $('detail').textContent='点击锥桶或标记查看原始坐标与来源。'+(missing.length?'\n缺少坐标的已分类格点：'+missing.join(', ')+'；未绘制模型。':'')+(view.tag&&!positionOk(view.tag.position)?'\n标记缺少世界坐标，未绘制。':'')+(mode==='submission'?'\n提交状态：'+JSON.stringify(view.evidence):'');
 $('notes').replaceChildren(...scene.notes.map(note=>{const p=document.createElement('p');p.textContent=note;return p}));if(view.tag&&!view.tag.pattern){const p=document.createElement('p');p.className='warning';p.textContent='标记字典未记录、ID 不在字典中或 OpenCV aruco 不可用：显示位置与 ID，不生成虚构码纹。';$('notes').append(p)}selected=null;fit();draw()}
DATA.scenes.forEach((scene,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`第 ${i+1} 轮 · ${scene.state||'未知'}`;$('run').append(option)});$('run').value=sceneIndex;
$('run').onchange=()=>{sceneIndex=Number($('run').value);updateInfo()};document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));updateInfo()});
$('home').onclick=()=>{az=-.35;el=.82;fit();draw()};$('top').onclick=()=>{az=0;el=Math.PI/2-.001;fit();draw()};for(const id of ['points','labels','guides'])$(id).onchange=draw;$('path').onchange=()=>{fit();draw()};
canvas.onpointerdown=event=>{drag={x:event.clientX,y:event.clientY,az,el,moved:false};canvas.setPointerCapture(event.pointerId);canvas.style.cursor='grabbing'};
canvas.onpointermove=event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;az=drag.az+dx*.007;el=Math.max(.12,Math.min(Math.PI/2-.001,drag.el+dy*.006));draw()};
canvas.onpointerup=event=>{if(drag&&!drag.moved){const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;let best=null,distance=65;for(const hit of hits){const p=project(hit.point),d=Math.hypot(p[0]-x,p[1]-y);if(d<distance){distance=d;best=hit}}if(best){selected={type:best.type,key:String(best.object.cell??best.object.id)};const o=best.object;$('detail').textContent=(best.type==='tag'?`TAG ${o.id}\n字典：${o.dictionary||'未记录'}`:`格 ${o.cell} · ${o.kind===0?'黄黑方形锥桶':'橙白圆形锥桶'}\n定位点：${o.anchor==='center'?'几何中心':'底面中心'}`)+`\n世界 XYZ / m：\n${o.position.map(v=>v.toFixed(4)).join(' / ')}\n来源：${o.source||'未记录'}\n`+(o.accepted!=null?`接受观测：${o.accepted}\n`:'')+(o.votes?`分类投票：${JSON.stringify(o.votes)}\n`:'')+(o.covariance?`协方差：${JSON.stringify(o.covariance)}`:'');draw()}}drag=null;canvas.style.cursor='grab'};
canvas.onpointercancel=()=>{drag=null;canvas.style.cursor='grab'};canvas.onwheel=event=>{event.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*Math.exp(-event.deltaY*.001)));draw()};
$('save').onclick=()=>{draw();const a=document.createElement('a');a.download=`map3d_run${sceneIndex+1}_${mode}.png`;a.href=canvas.toDataURL('image/png');a.click()};window.addEventListener('resize',draw);updateInfo();
</script></html>
