services:
  auv:
    # NVIDIA Container Toolkit injects /dev/nvidia* and matching driver
    # libraries. Keep this overlay opt-in so CPU-only hosts need no NVIDIA
    # runtime. Do not manually map /dev/dri: on hybrid AMD/NVIDIA laptops
    # that can make Mesa select the AMD radeonsi driver instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      YOULONG_NVIDIA_ENABLED: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      __VK_LAYER_NV_optimus: NVIDIA_only
