name: youlong-auv

services:
  auv:
    # Compose pulls Foxy and builds the complete Stonefish + ROS environment
    # from Dockerfile, including a user matching the host UID/GID.
    image: youlong_auv:foxy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
        HOST_USER: "${HOST_USER:-${USER:-dev}}"
        STONEFISH_BUILD_JOBS: "${STONEFISH_BUILD_JOBS:-1}"

    container_name: youlong_auv
    # HOST_USER defaults to the host's $USER. On hosts whose UID/GID is not
    # 1000, start with HOST_USER/HOST_UID/HOST_GID set together.
    user: "${HOST_USER:-${USER:-dev}}"
    working_dir: /workspace
    entrypoint: ["/ros_entrypoint.sh"]
    command: ["bash", "-lc", "exec tail -f /dev/null"]

    # ROS 2 DDS and application HTTP services share the host network.
    network_mode: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    shm_size: "64m"

    # Equivalent to `docker run --gpus all` for Compose v2.26.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      ROS_DISTRO: foxy
      DISPLAY: "${DISPLAY:-:1}"
      XAUTHORITY: /tmp/.Xauthority
      HOME: "/home/${HOST_USER:-${USER:-dev}}"
      ROS_HOME: /workspace/.docker/ros/foxy/ros
      ROS_LOG_DIR: /workspace/.docker/ros/foxy/log/ros
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      QT_X11_NO_MITSHM: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    volumes:
      # Run this file from the checked-out repository directory.
      - type: bind
        source: .
        target: /workspace
        read_only: false
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: false
      - type: bind
        # Prefer an explicitly exported XAUTHORITY; otherwise use the usual
        # per-user Xauthority file. GDM users can set XAUTHORITY_HOST if needed.
        source: "${XAUTHORITY_HOST:-${XAUTHORITY:-${HOME:-/tmp}/.Xauthority}}"
        target: /tmp/.Xauthority
        read_only: true
