name: youlong-auv

services:
  auv:
    # Defaults to Foxy. Set YOULONG_ROS_DISTRO=jazzy explicitly for Jazzy;
    # the host's ROS_DISTRO variable is intentionally ignored.
    image: youlong_auv:${YOULONG_ROS_DISTRO:-foxy}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        YOULONG_ROS_DISTRO: "${YOULONG_ROS_DISTRO:-foxy}"
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
        HOST_USER: "${HOST_USER:-${USER:-dev}}"
        STONEFISH_BUILD_JOBS: "${STONEFISH_BUILD_JOBS:-1}"

    container_name: youlong_auv
    # HOST_USER defaults to the host's $USER. On hosts whose UID/GID is not
    # 1000, start with HOST_USER/HOST_UID/HOST_GID set together.
    # Keep the normal container non-root so bind-mounted build artifacts stay
    # owned by the host user. For maintenance, use CONTAINER_USER=root.
    user: "${CONTAINER_USER:-${HOST_USER:-${USER:-dev}}}"
    working_dir: /workspace
    entrypoint: ["/ros_entrypoint.sh"]
    # Build the bind-mounted development workspaces in place before keeping
    # the container alive. The second workspace overlays the first one.
    command:
      - bash
      - -lc
      - |
          set -e
          mkdir -p "$${XDG_RUNTIME_DIR}"
          chmod 700 "$${XDG_RUNTIME_DIR}"

          # Keep rqt usable on Foxy without an extra wrapper script. The
          # default rqt perspective loads rqt_topic, which cannot parse
          # ROS 2 action feedback types and may abort with std::bad_alloc. A
          # plain `rqt` command opens the normal default perspective. Explicit
          # rqt arguments keep their normal meaning and use NVIDIA PRIME offload.
          if ! grep -q 'youlong-compose-nvidia-rqt-wrapper-v4' "$${HOME}/.bashrc" 2>/dev/null; then
            printf '%s\n' \
              '# youlong-compose-nvidia-rqt-wrapper-v4' \
              'rqt() {' \
              '  if [ "$$#" -eq 0 ]; then' \
              '    env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia QT_OPENGL=desktop rqt' \
              '  else' \
              '    env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia QT_OPENGL=desktop rqt "$$@"' \
              '  fi' \
              '}' >> "$${HOME}/.bashrc"
          fi

          # docker compose exec starts a fresh shell and does not replay the
          # ROS environment exported by the container entrypoint.  Generate
          # a login profile so `bash -lc "rqt"` also finds ROS and the local
          # workspace packages.
          printf '%s\n' \
            "source /opt/ros/$${ROS_DISTRO}/setup.bash" \
            '[ -f /workspace/workspace_auv/install/setup.bash ] && source /workspace/workspace_auv/install/setup.bash' \
            '[ -f /workspace/workspace_sim/install/setup.bash ] && source /workspace/workspace_sim/install/setup.bash' \
            '# youlong-compose-nvidia-rqt-login-v4' \
            'rqt() {' \
            '  if [ "$$#" -eq 0 ]; then' \
            '    env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia QT_OPENGL=desktop rqt' \
            '  else' \
            '    env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia QT_OPENGL=desktop rqt "$$@"' \
            '  fi' \
            '}' \
            '[ -f ~/.bashrc ] && . ~/.bashrc' > "$${HOME}/.bash_profile"

          source /opt/ros/$${ROS_DISTRO}/setup.bash
          cd /workspace/workspace_auv
          colcon build --symlink-install --parallel-workers 1
          source install/setup.bash
          # Keep the ZIT6 ROS packages in the same AUV install space.  The
          # package sources live in the vendored third-party tree, while
          # upper_examples depends on the interfaces built just before it.
          colcon build --symlink-install --parallel-workers 1 \
            --base-paths \
              /workspace/third_party/AUV_zit6_cmake/upper_examples \
              /workspace/third_party/AUV_zit6_cmake/zit6_interfaces \
            --packages-select zit6_interfaces upper_examples
          source install/setup.bash
          cd /workspace/workspace_sim
          colcon build --symlink-install --parallel-workers 1 --cmake-force-configure
          source install/setup.bash
          exec tail -f /dev/null

    # ROS 2 DDS and application HTTP services share the host network.
    network_mode: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    shm_size: "64m"

    # NVIDIA Container Toolkit injects /dev/nvidia* and the matching driver
    # libraries. Do not manually map /dev/dri here: on hybrid AMD/NVIDIA
    # laptops that can make Mesa select the AMD radeonsi driver instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      ROS_DISTRO: "${YOULONG_ROS_DISTRO:-foxy}"
      DISPLAY: "${DISPLAY:-:1}"
      XAUTHORITY: /tmp/.Xauthority
      HOME: "/home/${HOST_USER:-${USER:-dev}}"
      ROS_HOME: "/workspace/.docker/ros/${YOULONG_ROS_DISTRO:-foxy}/ros"
      ROS_LOG_DIR: "/workspace/.docker/ros/${YOULONG_ROS_DISTRO:-foxy}/log/ros"
      XDG_RUNTIME_DIR: "/tmp/runtime-${HOST_UID:-1000}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      __VK_LAYER_NV_optimus: NVIDIA_only
      # Stonefish uses SDL2 for its graphical window.  The container exposes
      # the host X11 socket, so do not let SDL probe Wayland/other backends.
      SDL_VIDEODRIVER: x11
      SDL_VIDEO_X11_FORCE_EGL: "0"
      QT_QPA_PLATFORM: xcb
      QT_QPA_FONTDIR: /usr/share/fonts/opentype/noto
      QT_X11_NO_MITSHM: "1"
      # Keep the previously working Qt scale.  Font installation and scaling
      # are intentionally kept separate from the ROS/DDS runtime diagnosis.
      # Override with QT_SCALE_FACTOR=1.0 or 1.5 when starting Compose.
      QT_SCALE_FACTOR: "${QT_SCALE_FACTOR:-1.25}"
      LANG: C.UTF-8
      LC_ALL: zh_CN.UTF-8

    volumes:
      # Run this file from the checked-out repository directory.
      - type: bind
        source: .
        target: /workspace
        read_only: false
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: false
      - type: bind
        # Prefer an explicitly exported XAUTHORITY; otherwise use the usual
        # per-user Xauthority file. GDM users can set XAUTHORITY_HOST if needed.
        source: "${XAUTHORITY_HOST:-${XAUTHORITY:-${HOME:-/tmp}/.Xauthority}}"
        target: /tmp/.Xauthority
        read_only: true
